name: Glocal CMS Backend CI/CD
'on':
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-and-build:
    name: Test and Build Backend
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--experimental-vm-modules'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test -- --runInBand
      - name: Build NestJS application
        run: npm run build
  publish-docker-images:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: 'ghcr.io/mishraanshuman786/glocal-cms-be:latest'
      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: 'ghcr.io/mishraanshuman786/glocal-cms-be:migrator'
  deploy-images-to-vps:
    name: Pull Images on VPS
    runs-on: ubuntu-latest
    needs: publish-docker-images
    steps:
      - name: Pull Docker images on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: '${{ secrets.GHCR_USERNAME }}'
          GHCR_READ_TOKEN: '${{ secrets.GHCR_READ_TOKEN }}'
        with:
          host: '${{ secrets.VPS_HOST }}'
          username: '${{ secrets.VPS_USERNAME }}'
          key: '${{ secrets.VPS_SSH_KEY }}'
          port: '${{ secrets.VPS_PORT }}'
          envs: 'GHCR_USERNAME,GHCR_READ_TOKEN'
          debug: false
          script: |
            set -e

            echo "Creating deployment directory..."
            mkdir -p /root/glocal-cms-backend

            echo "Logging in to GitHub Container Registry..."
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            echo "Pulling production backend image..."
            docker pull ghcr.io/mishraanshuman786/glocal-cms-be:latest

            echo "Pulling database migrator image..."
            docker pull ghcr.io/mishraanshuman786/glocal-cms-be:migrator

            echo "Logging out from GitHub Container Registry..."
            docker logout ghcr.io

            echo "Images successfully pulled."

            echo "Available Glocal CMS images:"
            docker image ls ghcr.io/mishraanshuman786/glocal-cms-be
